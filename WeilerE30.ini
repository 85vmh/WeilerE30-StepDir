[MESA]
VERSION = 2.1.2
BOARD = 7i95
BOARD_NAME = 7i95t
FIRMWARE = 7i95t_1pktv2d.bin
CARD_0 = None
CARD_1 = None

[HM2]
DRIVER = hm2_eth
ADDRESS = 10.10.10.10

[EMC]
MACHINE = WeilerE30
DEBUG = 0
VERSION = 1.1

[DISPLAY]
#DISPLAY = axis
DISPLAY = teachinlathe

POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = COMMANDED
MAX_FEED_OVERRIDE = 1.200000
MAX_SPINDLE_OVERRIDE = 1.200000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 1
#PROGRAM_PREFIX = /home/cnc/Work/linuxcnc-dev/configs
PROGRAM_PREFIX = ~/Work/Weiler NC Files
LATHE = 1
DEFAULT_LINEAR_VELOCITY = 6.000000
DEFAULT_SPINDLE_SPEED = 300
MAX_LINEAR_VELOCITY = 100.000000
MIN_LINEAR_VELOCITY = 0.500000
GEOMETRY = XZ
CYCLE_TIME = 0.1

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
RS274NGC_STARTUP_CODE = G7 G18 G21 G54 G90 S300 G97 G95 F0.1
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = /home/cnc/Work/teachinlathe/subroutines
# TeachInLathe's G-code: M6 stops the spindle, goes to the tool change position,
# changes the tool, applies its offset (G43) and waits for cycle start (M0);
# M1 is Pause to Inspect (P0 where it is, P1 at G28, P2 at G30)
REMAP = M6 modalgroup=6 ngc=m6_remap
REMAP = M1 modalgroup=4 argspec=p ngc=m1_remap

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 500000
# SERVO_PERIOD = 1000000

[HMOT]
# **** This is for info only ****
CARD0=hm2_7i92.0

[HAL]
HALUI = halui
HALFILE = WeilerE30.hal
HALFILE = common-loadrt-addf.hal
HALFILE = mesa-io.hal
HALFILE = homing.hal
HALFILE = panel-buttons.hal
HALFILE = overrides.hal
HALFILE = axes-mpg.hal
HALFILE = spindle-lincurve.hal
HALFILE = spindle-orient.hal
HALFILE = custom.hal
HALFILE = spindle_lubrication.hal
POSTGUI_HALFILE = weiler_postgui.hal
SHUTDOWN = shutdown.hal

[HALUI]

[KINS]
JOINTS = 2
KINEMATICS = trivkins coordinates=XZ

[TRAJ]
COORDINATES =  XZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.50
MAX_LINEAR_VELOCITY = 100.00

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
# M6's default tool change position, machine coordinates "X Y Z" (Y unused): X where
# X homes (JOINT_0 HOME), Z 200 mm towards Z+ from where Z homes (JOINT_1 HOME 150).
# The Manual Turning tab can override it through iocontrol.0.tool-change-pos-*.
TOOL_CHANGE_POSITION = 135.0 0 350.0

